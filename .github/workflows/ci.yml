name: checks

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the checks on demand, without having to invent a commit.
  workflow_dispatch:

# A second push to the same branch makes the first run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml claims ">=3.13". Running both is what makes that
        # claim true rather than aspirational.
        python: ["3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so the token has no reason to sit in
          # .git/config where a later step could pick it up.
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - run: pip install -e ".[dev]"

      # The same three checks pre-commit runs locally, in the same order.
      - run: ruff format --check .
      - run: ruff check .

      # Point pyrefly at this interpreter explicitly. Left to itself it picks
      # one off PATH, and checking against another version's standard library
      # invents errors that have nothing to do with the code.
      - run: pyrefly check --python-interpreter-path "$(which python)"

      # Three separate runs, not one, so coverage/results can be flagged by
      # kind on Codecov. All three generate their own fixtures - none of
      # them touches the real, multi-gigabyte sample files (see
      # tests/conftest.py), which is why there is no fourth "bigfile" run
      # here.
      - name: Unit tests
        run: pytest tests/unit -o addopts="-ra --strict-markers --strict-config" --cov=optiff --cov-report=xml:coverage-unit.xml --junitxml=junit-unit.xml -o junit_family=legacy

      - name: Integration + e2e tests
        run: pytest tests/integration tests/e2e -m "not slow and not bigfile" -o addopts="-ra --strict-markers --strict-config" --cov=optiff --cov-report=xml:coverage-integration.xml --junitxml=junit-integration.xml -o junit_family=legacy

      - name: Doctests
        run: pytest optiff tests/unit/builders.py tests/sample_files.py -o addopts="--doctest-modules" --cov=optiff --cov-report=xml:coverage-doctest.xml --junitxml=junit-doctest.xml -o junit_family=legacy

      - name: Upload unit coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-unit.xml
          flags: unit

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.xml
          flags: integration

      - name: Upload doctest coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-doctest.xml
          flags: doctest

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit-unit.xml,./junit-integration.xml,./junit-doctest.xml
          report_type: test_results
