[project]
name = "optiff"
version = "0.1.0"
description = "Lossless recompression of layered TIFF files with Photoshop data"
readme = "README.md"
requires-python = ">=3.13"
# "only", not "or-later": the terms stay the ones reviewed here. As sole
# copyright holder the owner can always grant more, never less.
license = "GPL-3.0-only"
license-files = ["LICENSE"]
dependencies = [
    "tifffile>=2024.1.30",
    "numpy",
]

[project.scripts]
optiff = "optiff.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
    "pyrefly>=1.2",
    "pre-commit>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optiff"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "optiff"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "-m", "not slow and not bigfile",
    "--doctest-modules",
]
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
markers = [
    "slow: needs a large sample file",
    "bigfile: needs multi-gigabyte production files",
]
filterwarnings = ["error", "ignore::DeprecationWarning:tifffile.*"]

[tool.coverage.run]
source = ["optiff"]
# Exercised by tests/e2e/test_cli.py through `python -m optiff`; coverage.py
# cannot see into that subprocess without extra plumbing.
omit = ["optiff/__main__.py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "ARG", "C4", "PL"]
ignore = [
    # Magic numbers are the subject matter of a binary parser.
    "PLR2004",
    # The "x" in report dimensions (4128 x 6192) is a deliberate typographic
    # choice, not a stray character.
    "RUF001",
    "RUF002",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["optiff"]

[tool.pyrefly]
project-includes = ["optiff", "tests", "tools"]
python-version = "3.13"
