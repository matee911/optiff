coverage:
  status:
    project:
      default:
        # No regressions allowed against the base commit.
        target: auto
        threshold: 0%
    patch:
      default:
        target: 95%

component_management:
  default_rules:
    statuses:
      - type: project
        target: auto
        threshold: 0%
  individual_components:
    - component_id: core
      name: core codec/domain
      paths:
        - "optiff/**"
        - "!optiff/cli.py"
        - "!optiff/commands/**"
        - "!optiff/formatters/**"
      statuses:
        - type: project
          target: 98%
    - component_id: cli
      name: CLI presentation
      paths:
        - "optiff/cli.py"
        - "optiff/commands/**"
        - "optiff/formatters/**"

flag_management:
  default_rules:
    carryforward: false
  individual_flags:
    # unit / integration / doctest run on every push+PR (see ci.yml).
    - name: unit
    - name: integration
    - name: doctest
    # Needs multi-gigabyte production files that never enter the repo
    # (tests/conftest.py), so it is never uploaded from CI. Carryforward
    # keeps its last known value instead of showing "no report" here.
    - name: bigfile
      carryforward: true

comment:
  layout: "reach, diff, flags, components, files"

ignore:
  - "tests/**"
  - "tools/**"
